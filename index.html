<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 體感防守小遊戲</title>
    <!-- 引入 p5.js 與 Teachable Machine 官方函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e94560; margin-bottom: 5px; }
        #canvas-container {
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: inline-block;
        }
        .info-panel {
            font-size: 16px;
            background: #16213e;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #0f3460;
        }
        #webcam-preview {
            display: none; /* 隱藏官方的小視窗，我們直接畫在 p5.js 画布裡 */
        }
    </style>
</head>
<body>

    <h1>AI 體感防守小遊戲</h1>
    <p>操作說明：點擊下方按鈕啟動攝影機，身體往<strong>左/右傾斜</strong>或使用鍵盤 <strong>← / →</strong> 控制移動！</p>
    
    <button type="button" onclick="initGame()" style="padding: 10px 20px; font-size: 16px; background-color: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px;">點擊這裡開始遊戲</button>

    <div id="canvas-container"></div>
    <br>
    <div class="info-panel" id="status-text">請先點擊上方按鈕以啟動遊戲與攝影機...</div>
    
    <div id="webcam-preview"></div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/GlpcKNqid/";

        let model, webcam, maxPredictions;
        let gameStarted = false;

        // 遊戲變數
        let playerX, playerY;
        let playerSize = 60;
        let score = 0;
        let lives = 3;
        let obstacles = [];
        let currentPredictionText = "等待啟動...";

        async function initGame() {
            if (gameStarted) return;
            
            document.getElementById("status-text").innerText = "正在載入模型與攝影機...";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 載入官方模型
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 設定攝影機
            const flip = true; 
            webcam = new tmImage.Webcam(640, 480, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 把攝影機畫面放到隱藏區塊
            document.getElementById("webcam-preview").appendChild(webcam.canvas);

            gameStarted = true;
            document.getElementById("status-text").innerText = "遊戲已開始！";
        }

        async function loop() {
            webcam.update(); // 更新攝影機畫面
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!gameStarted) return;
            const prediction = await model.predict(webcam.canvas);
            
            // 找出機率最高的那一個動作
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                let prob = prediction[i].probability;
                let className = prediction[i].className.toLowerCase();
                
                if (prob > highestProb) {
                    highestProb = prob;
                    bestClass = className;
                }
            }

            currentPredictionText = `${bestClass} (${(highestProb * 100).toFixed(0)}%)`;

            // 根據辨識結果控制玩家移動
            if (highestProb > 0.65) {
                if (bestClass.includes("left") || bestClass.includes("左")) {
                    playerX -= 12;
                } else if (bestClass.includes("right") || bestClass.includes("右")) {
                    playerX += 12;
                }
            }
        }

        function setup() {
            let canvas = createCanvas(640, 480);
            canvas.parent('canvas-container');

            playerX = width / 2;
            playerY = height - 70;

            setInterval(spawnObstacle, 1500);
        }

        function draw() {
            background(20, 20, 35);

            // 1. 如果攝影機已啟動，將官方 webcam 的畫面畫到 p5.js 的畫布上
            if (gameStarted && webcam && webcam.canvas) {
                push();
                tint(255, 140);
                image(webcam.canvas, 0, 0, width, height);
                pop();
            }

            // 2. 鍵盤保底控制（← / → 鍵）
            if (keyIsDown(LEFT_ARROW)) {
                playerX -= 12;
                currentPredictionText = "鍵盤：向左";
            } else if (keyIsDown(RIGHT_ARROW)) {
                playerX += 12;
                currentPredictionText = "鍵盤：向右";
            }

            // 限制玩家不能跑出畫面外
            playerX = constrain(playerX, playerSize / 2, width - playerSize / 2);

            // 3. 繪製玩家位置指示器
            push();
            noFill();
            stroke(0, 255, 255);
            strokeWeight(4);
            ellipse(playerX, playerY, playerSize + 10, playerSize + 10);
            
            fill(0, 210, 255, 230);
            noStroke();
            ellipse(playerX, playerY, playerSize, playerSize);

            fill(255);
            textSize(12);
            textAlign(CENTER, CENTER);
            text("YOU", playerX, playerY - 8);
            textSize(18);
            text("⬇", playerX, playerY + 10);
            pop();

            // 4. 更新與繪製障礙物（炸彈）
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                fill(255, 50, 50);
                noStroke();
                ellipse(obs.x, obs.y, obs.r, obs.r);
                fill(255);
                textSize(12);
                textAlign(CENTER, CENTER);
                text("BOMB", obs.x, obs.y);

                // 碰撞檢測
                let d = dist(playerX, playerY, obs.x, obs.y);
                if (d < (playerSize / 2 + obs.r / 2)) {
                    lives--;
                    obstacles.splice(i, 1);
                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (obs.y > height + obs.r) {
                    score += 10;
                    obstacles.splice(i, 1);
                }
            }

            // 5. 顯示 UI 分數與生命值
            fill(255);
            textSize(22);
            textAlign(LEFT);
            text("Score: " + score, 20, 35);
            text("Lives: " + "❤️".repeat(Math.max(0, lives)), width - 150, 35);

            if (gameStarted) {
                document.getElementById("status-text").innerText = 
                    `辨識結果: [ ${currentPredictionText} ] | 分數: ${score} | 生命: ${lives}/3`;
            }
        }

        function spawnObstacle() {
            if (gameStarted && lives > 0) {
                obstacles.push({
                    x: random(40, width - 40),
                    y: -30,
                    r: 45,
                    speed: random(3, 6)
                });
            }
        }

        function gameOver() {
            background(0, 180);
            fill(255, 50, 50);
            textSize(52);
            textAlign(CENTER, CENTER);
            text("GAME OVER", width / 2, height / 2 - 20);
            fill(255);
            textSize(20);
            text("重新整理網頁即可重新開始遊戲", width / 2, height / 2 + 40);
            noLoop();
        }
    </script>
</body>
</html>
