<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 體感防守小遊戲</title>
    <!-- 引入 p5.js 與最新 ml5.js 函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e94560; margin-bottom: 5px; }
        #canvas-container {
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: inline-block;
        }
        .info-panel {
            font-size: 16px;
            background: #16213e;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #0f3460;
        }
    </style>
</head>
<body>

    <h1>AI 體感防守小遊戲</h1>
    <p>操作說明：對著鏡頭擺動，或隨時使用鍵盤 <strong>← 鍵 / → 鍵</strong> 控制移動！躲避紅色炸彈！</p>

    <div id="canvas-container"></div>
    <br>
    <div class="info-panel" id="status-text">載入模型與攝影機中...</div>

    <script>
        let imageModelURL = 'https://teachablemachine.withgoogle.com/models/GlpcKNqid/';
        
        let classifier;
        let video;
        let prediction = "等待辨識...";
        let allResults = [];

        let playerX;
        let playerY;
        let playerSize = 60;
        let score = 0;
        let lives = 3;
        let obstacles = [];

        function preload() {
            classifier = ml5.imageClassifier(imageModelURL + 'model.json');
        }

        function setup() {
            let canvas = createCanvas(640, 480);
            canvas.parent('canvas-container');
            
            video = createCapture(VIDEO, function() {
                video.size(640, 480);
                video.hide();
                classifyVideo();
            });

            playerX = width / 2;
            playerY = height - 70;

            setInterval(spawnObstacle, 1500);
        }

        function draw() {
            background(20, 20, 35);
            
            // 1. 繪製鏡像攝影機畫面
            push();
            translate(width, 0);
            scale(-1, 1);
            tint(255, 140);
            image(video, 0, 0, width, height);
            pop();

            // 2. 移動控制：結合鍵盤保底與「直接依陣列順序」控制
            if (keyIsDown(LEFT_ARROW)) {
                playerX -= 12; 
                prediction = "鍵盤控制：向左";
            } else if (keyIsDown(RIGHT_ARROW)) {
                playerX += 12; 
                prediction = "鍵盤控制：向右";
            } else if (allResults.length >= 2) {
                // 直接抓取機率最高的那一個類別（陣列第 0 個）
                let topResult = allResults[0];
                prediction = `${topResult.label} (${nf(topResult.confidence * 100, 0, 0)}%)`;

                // 假設你在 Teachable Machine 訓練的第一個類別（上方）代表左邊，第二個代表右邊
                // 如果結果是陣列中的第 0 個類別（通常對應你訓練的第一個 Class）
                if (topResult.confidence > 0.55) {
                    // 檢查它是不是你訓練的第一個類別名稱（比對結果陣列順序）
                    if (topResult.label === allResults[0].label) {
                        // 讓第一個類別控制向左，第二個類別控制向右
                        // 這裡我們簡單用：若它是所有類別裡的第一個，就判定為左或右
                    }
                }
                
                // 更直覺的強制對應：我們看當前最高機率是第 0 個還是第 1 個類別
                // 假設第 0 個類別（你畫面上的第一個框）代表向左：
                if (topResult.label.toLowerCase().includes("left") || 
                    topResult.label.toLowerCase().includes("左") || 
                    topResult.label === "Class 5" || // 如果還沒重新訓練完的暫時對應
                    topResult === allResults[0] && topResult.confidence > 0.6) {
                    
                    // 為了保險，我們直接看是第一個還是第二個區塊機率高
                    // 這裡我們讓「第一個類別」往左，「第二個類別」往右
                }

                // 萬無一失的硬體對應：直接用結果陣列排序來分左右
                // 假設 results[0] 是第一個類別，results[1] 是第二個類別
                if (allResults[0].confidence > allResults[1].confidence) {
                    if (allResults[0].label.toLowerCase().includes("right") || allResults[0].label.toLowerCase().includes("右") || allResults[0].label === "Class 6") {
                        playerX += 12;
                    } else {
                        playerX -= 12;
                    }
                } else {
                    playerX += 12;
                }
            }

            // 限制玩家不能跑出畫面外
            playerX = constrain(playerX, playerSize / 2, width - playerSize / 2);

            // 3. 繪製玩家位置指示器
            push();
            noFill();
            stroke(0, 255, 255);
            strokeWeight(4);
            ellipse(playerX, playerY, playerSize + 10, playerSize + 10);
            
            fill(0, 210, 255, 230);
            noStroke();
            ellipse(playerX, playerY, playerSize, playerSize);

            fill(255);
            textSize(12);
            textAlign(CENTER, CENTER);
            text("YOU", playerX, playerY - 8);
            textSize(18);
            text("⬇", playerX, playerY + 10);
            pop();

            // 4. 更新與繪製障礙物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                fill(255, 50, 50);
                noStroke();
                ellipse(obs.x, obs.y, obs.r, obs.r);
                fill(255);
                textSize(12);
                textAlign(CENTER, CENTER);
                text("BOMB", obs.x, obs.y);

                // 碰撞檢測
                let d = dist(playerX, playerY, obs.x, obs.y);
                if (d < (playerSize / 2 + obs.r / 2)) {
                    lives--;
                    obstacles.splice(i, 1);
                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (obs.y > height + obs.r) {
                    score += 10;
                    obstacles.splice(i, 1);
                }
            }

            // 5. 顯示 UI 分數與生命值
            fill(255);
            textSize(22);
            textAlign(LEFT);
            text("Score: " + score, 20, 35);
            text("Lives: " + "❤️".repeat(Math.max(0, lives)), width - 150, 35);

            document.getElementById("status-text").innerText = 
                `辨識狀態: [ ${prediction} ] | 分數: ${score} | 生命: ${lives}/3`;
        }

        function classifyVideo() {
            classifier.classify(video, (error, results) => {
                if (error) {
                    console.error(error);
                    return;
                }
                allResults = results;
                classifyVideo();
            });
        }

        function spawnObstacle() {
            if (lives > 0) {
                obstacles.push({
                    x: random(40, width - 40),
                    y: -30,
                    r: 45,
                    speed: random(3, 6)
                });
            }
        }

        function gameOver() {
            background(0, 180);
            fill(255, 50, 50);
            textSize(52);
            textAlign(CENTER, CENTER);
            text("GAME OVER", width / 2, height / 2 - 20);
            fill(255);
            textSize(20);
            text("重新整理網頁即可重新開始遊戲", width / 2, height / 2 + 40);
            noLoop();
        }
    </script>
</body>
</html>
